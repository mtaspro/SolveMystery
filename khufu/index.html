<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>410 - Page Removed</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%94%8E%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/shared/style.css">
  <link rel="stylesheet" href="/khufu/style.css">
  <link rel="stylesheet" href="/shared/hints.css">
</head>
<body>
  <main class="screen nf" id="scene" tabindex="-1">
    <div class="nf__inner">

      <!-- ===== Glitching 410 headline ===== -->
      <h1 class="nf__code" id="pageCode" data-i18n="removed.code">410 - PAGE REMOVED</h1>

      <!-- ===== Message ===== -->
      <p class="nf__taunt" id="pageMessage" data-i18n="removed.message">
        This page has been deleted by the administrator.
      </p>

      <!-- ===== Last seen ===== -->
      <p class="nf__note" id="lastSeen" data-i18n="removed.lastSeen">
        Last seen: a few days ago
      </p>

      <!-- ===== Hints action bar + sheet are rendered by /shared/hints.js ===== -->
    </div>
  </main>

  <p class="sr-only" id="status" role="status" aria-live="polite"></p>

  <script type="module" src="/khufu/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="robots" content="noindex">
  <title>Stage 3 — Science Lab CCTV Archive</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%94%AD%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/shared/style.css">
  <link rel="stylesheet" href="/shush/style.css">
  <link rel="stylesheet" href="/shared/hints.css">
</head>
<body>
  <!-- No JS: the still never arrives, so skip the gate and show the page. -->
  <noscript><style>.intro{display:none}</style></noscript>

  <div class="lab">
    <!-- ===== CCTV archive header. The school name is rendered from SCHOOL_NAME
         in /shush/script.js; the copy below is only a no-JS fallback. ===== -->
    <header class="cctv">
      <p class="cctv__rec"><span class="cctv__dot" aria-hidden="true"></span><span data-i18n="lab.rec">REC</span></p>
      <h1 class="cctv__title">
        <span id="siteName">Greenfield School</span> - <span data-i18n="lab.department">Science Dept. - CCTV Archive</span>
      </h1>
      <p class="cctv__strip">
        <span data-i18n="lab.stripPrefix">Camera 02 - Lab 3 - Footage flagged by:</span> <span class="cctv__flag">E. XAMINER</span>
      </p>
    </header>

    <main class="lab__main">
      <!-- ===== The monitor. The still arrives from LAB_IMAGE_URL in
           /shush/script.js; the dashed box is what shows until it does. ===== -->
      <figure class="mon">
        <div class="mon__frame">
          <button class="mon__btn" id="footageBtn" type="button" hidden>
            <img class="mon__img" id="footage"
                 alt="Security camera still from Lab 3, showing the whiteboard."
                 decoding="async">
          </button>
          <p class="mon__ph" id="footagePh" data-i18n="lab.placeholder">Footage loading... (add LAB_IMAGE_URL)</p>
          <span class="mon__scan" aria-hidden="true"></span>
        </div>
        <figcaption class="mon__cap" data-i18n="lab.caption">Tap the footage to enlarge.</figcaption>
      </figure>

      <p class="log" data-i18n="lab.log">Evidence log: 3 marked items.</p>
    </main>
  </div>

  <!-- ===== Enlarged footage: pinch, drag and double-tap to inspect the still.
       The scroll surface is #zoomScroll; see /shush/script.js and the
       .zoom__scroll rules in /shush/style.css. ===== -->
  <div class="zoom" id="zoom" role="dialog" aria-modal="true" data-i18n-aria="lab.zoomAria" aria-label="Enlarged footage" hidden>
    <button class="zoom__close" id="zoomClose" type="button" data-i18n="common.close">Close</button>
    <p class="zoom__tip" id="zoomTip" aria-hidden="true" data-i18n="lab.zoomTip">Double-tap to zoom</p>
    <div class="zoom__scroll" id="zoomScroll">
      <img class="zoom__img" id="zoomImg" alt="">
    </div>
  </div>

  <!-- ===== Intro overlay: a note from The Examiner ===== -->
  <div class="intro" id="intro" role="dialog" aria-modal="true" aria-labelledby="introFrom">
    <div class="intro__card">
      <p class="intro__from" id="introFrom" data-i18n="common.from">The Examiner</p>
      <p class="intro__text" id="introText" aria-hidden="true"></p>
      <p class="sr-only" data-i18n="lab.intro">At 03:07 AM something was written on the board. Cameras never lie. Neither do elements.</p>
      <button class="cam-btn cam-btn--solid" id="beginBtn" type="button" data-i18n="common.begin">Begin</button>
    </div>
  </div>

  <p class="sr-only" id="status" role="status" aria-live="polite"></p>

  <script type="module" src="/shush/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Stage 1 — The Corridor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%94%AD%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/shared/style.css">
  <link rel="stylesheet" href="/corridor/style.css">
  <link rel="stylesheet" href="/shared/hints.css">
</head>
<body>
  <noscript><style>.overlay{display:none}</style></noscript>

  <!-- ===== Intro overlay ===== -->
  <div class="overlay" id="intro" role="dialog" aria-modal="true" aria-labelledby="introFrom">
    <div class="overlay__card">
      <p class="overlay__from" id="introFrom" data-i18n="common.from">The Examiner</p>
      <p class="overlay__text" id="introText" aria-hidden="true"><span id="typed"></span><span class="caret"></span></p>
      <p class="sr-only" data-i18n="corridor.intro">Candidates, your results have been relocated. Remain calm. Panic is permitted.</p>
      <button class="btn" id="beginBtn" type="button" data-i18n="common.begin">Begin</button>
    </div>
  </div>

  <!-- ===== Stage 1 scene ===== -->
  <main class="scene" id="scene" tabindex="-1">
    <div class="corridor">
      <!-- Back wall -->
      <div class="wall">
        <!-- Wall clock (inline SVG, no external image) -->
        <div class="clock" role="img" data-i18n-aria="corridor.clockLabel" aria-label="Wall clock, quarter past three">
          <svg class="clock__svg" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
            <circle class="clock__face" cx="50" cy="50" r="46"/>
            <g class="clock__ticks">
              <line x1="50" y1="8" x2="50" y2="17"/>
              <line x1="50" y1="83" x2="50" y2="92"/>
              <line x1="8" y1="50" x2="17" y2="50"/>
              <line x1="83" y1="50" x2="92" y2="50"/>
            </g>
            <line class="clock__hand clock__hand--hour" x1="50" y1="50" x2="50" y2="30"/>
            <line class="clock__hand clock__hand--min" x1="50" y1="50" x2="78" y2="50"/>
            <circle class="clock__hole" cx="50" cy="50" r="3"/>
          </svg>
        </div>

        <!-- Noticeboard -->
        <section class="noticeboard" data-i18n-aria="corridor.noticeboard" aria-label="Noticeboard">
          <article class="timetable" data-i18n-aria="corridor.timetable" aria-label="Timetable">
            <h2 class="timetable__title" data-i18n="corridor.timetable">Timetable</h2>
            <ul class="timetable__list">
              <li class="timetable__row"><span class="timetable__slot">P1</span> Maths</li>
              <li class="timetable__row"><span class="timetable__slot">P2</span> Physics</li>
              <li class="timetable__row"><span class="timetable__slot">P3</span> Chemistry</li>
              <li class="timetable__row"><span class="timetable__slot">P4</span> English</li>
            </ul>
          </article>

          <button class="sticky" id="stickyNote" type="button" aria-pressed="false">
            <span class="sticky__pin" aria-hidden="true"></span>
            <span class="sticky__text" data-i18n="corridor.stickyNote">Don't trust the lights.</span>
          </button>
        </section>
      </div>

      <!-- Lockers (CSS shapes) -->
      <div class="lockers" aria-hidden="true">
        <span class="locker"></span><span class="locker"></span><span class="locker"></span>
        <span class="locker"></span><span class="locker"></span><span class="locker"></span>
        <span class="locker"></span><span class="locker"></span>
      </div>

      <!-- Floor -->
      <div class="floor" aria-hidden="true"></div>
    </div>

    <!-- Darkness layer: the torch hole follows --x/--y -->
    <span class="scene__dark" aria-hidden="true"></span>

    <!-- Chalk marks + doodles: revealed only inside the torch radius.
         Order = timetable order (Maths, Physics, Chemistry, English) -> 2 7 4 9. -->
    <div class="chalk" aria-hidden="true">
      <span class="chalk__mark" style="--cx:20%;--cy:30%">
        <svg class="chalk__doodle" viewBox="0 0 24 24"><path d="M5 7h14M9.5 7v10M15.5 7v10"/></svg>
        <span class="chalk__digit">2</span>
      </span>
      <span class="chalk__mark" style="--cx:73%;--cy:25%">
        <svg class="chalk__doodle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.3"/><ellipse cx="12" cy="12" rx="10" ry="4.3"/><ellipse cx="12" cy="12" rx="10" ry="4.3" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4.3" transform="rotate(-60 12 12)"/></svg>
        <span class="chalk__digit">7</span>
      </span>
      <span class="chalk__mark" style="--cx:27%;--cy:70%">
        <svg class="chalk__doodle" viewBox="0 0 24 24"><path d="M9 3h6"/><path d="M10 3v6L5.6 18.2A1.8 1.8 0 0 0 7.2 21h9.6a1.8 1.8 0 0 0 1.6-2.8L14 9V3"/><path d="M7.6 14.5h8.8"/></svg>
        <span class="chalk__digit">4</span>
      </span>
      <span class="chalk__mark" style="--cx:74%;--cy:68%">
        <svg class="chalk__doodle" viewBox="0 0 24 24"><path d="M12 6.5C10 4.8 7.4 4.2 4.5 4.6v13c2.9-.4 5.5.2 7.5 1.9 2-1.7 4.6-2.3 7.5-1.9v-13C16.6 4.2 14 4.8 12 6.5Z"/><path d="M12 6.5v13"/></svg>
        <span class="chalk__digit">9</span>
      </span>
    </div>

    <!-- Faint instruction, fades after the first drag -->
    <p class="torch-hint" id="torchHint" data-i18n="corridor.torchHint">Drag your finger to look around</p>

    <!-- Wall light switch, bottom-right, 56px tap target -->
    <button class="switch" id="lightSwitch" type="button" aria-pressed="true" data-i18n-aria="corridor.switchOn" aria-label="Light switch (lights on)">
      <span class="switch__plate" aria-hidden="true"><span class="switch__rocker"></span></span>
    </button>
  </main>

  <!-- The "Stuck?" action bar and the hints bottom sheet are rendered by
       /shared/hints.js, so they are not part of this markup. -->

  <p class="sr-only" id="status" role="status" aria-live="polite"></p>

  <script type="module" src="/corridor/script.js"></script>
</body>
</html>

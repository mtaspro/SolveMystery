<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>CANDIDATE BOARD</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%94%AD%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/shared/style.css">
  <link rel="stylesheet" href="/shared/hints.css">
  <link rel="stylesheet" href="/board/style.css">
</head>
<body>
  <main class="screen board" id="app">
    <header class="board__header">
      <h1 class="board__title" data-i18n="board.header">CANDIDATE BOARD</h1>
      <p class="board__subtitle" data-i18n="board.subtitle">Leaderboards for the investigation</p>
    </header>

    <div class="board__tabs" role="tablist">
      <button class="btn btn--ghost board__tab is-active" id="tabFastest" role="tab" type="button" data-i18n="board.tabFastest">Fastest</button>
      <button class="btn btn--ghost board__tab" id="tabDedicated" role="tab" type="button" data-i18n="board.tabDedicated">Most dedicated</button>
    </div>

    <div class="board__toolbar">
      <button class="btn btn--ghost board__refresh" id="refreshBtn" type="button" data-i18n="board.refresh">Refresh</button>
    </div>

    <div class="board__hint" id="boardHint" data-i18n="board.hintNote">Each hint adds 60 seconds.</div>

    <div class="board__table-wrap">
      <table class="board__table" id="boardTable">
        <thead>
          <tr id="boardHeadRow"></tr>
        </thead>
        <tbody id="boardBody">
          <tr><td colspan="1" class="board__empty" data-i18n="board.noData">No candidates yet.</td></tr>
        </tbody>
      </table>
    </div>

    <p class="board__status" id="boardStatus" aria-live="polite"></p>
  </main>

  <script type="module" src="/board/script.js"></script>
</body>
</html>
